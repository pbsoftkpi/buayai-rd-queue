<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ระบบเรียกคิว • สำนักงานสรรพากรพื้นที่สาขาบัวใหญ่ (Buayai - RD)</title>

    <!-- ฟอนต์ภาษาไทยมาตรฐานสำหรับหน้าจอแสดงผลและระบบปฏิบัติการ -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700;800;900&family=Prompt:wght@500;600;700;800;900&display=swap"
        rel="stylesheet"
    />

    <!-- Tailwind CSS CDN พร้อม Error Fallback ด้านล่าง -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        if (window.tailwind) {
            window.tailwind.config = {
                theme: {
                    extend: {
                        fontFamily: {
                            sans: ['"Noto Sans Thai"', 'system-ui', '-apple-system', 'sans-serif'],
                            display: ['"Prompt"', '"Noto Sans Thai"', 'system-ui', 'sans-serif']
                        },
                        colors: {
                            navy: {
                                800: '#102A43',
                                900: '#0B1D30'
                            },
                            skybrand: {
                                50: '#F0F9FF',
                                100: '#E0F2FE',
                                200: '#BAE6FD',
                                300: '#7DD3FC',
                                500: '#0EA5E9',
                                600: '#0284C7',
                                700: '#0369A1',
                                800: '#075985'
                            }
                        }
                    }
                }
            };
        }
    </script>

    <style>
        /* สไตล์พื้นฐานสำรองกรณี CDN โหลดช้าหรือถูกบล็อก */
        :root {
            --bg-page: #EAF4FC;
            --text-main: #0F2942;
            --border-soft: #C7E0F4;
        }

        html, body {
            margin: 0;
            padding: 0;
            min-height: 100%;
            font-family: "Noto Sans Thai", system-ui, -apple-system, sans-serif;
            background-color: var(--bg-page);
            color: var(--text-main);
        }

        /* พื้นหลังลายน้ำสระดอกบัวสำหรับหน้าจอแสดงผลคิว */
        .lotus-pond-bg {
            position: relative;
            isolation: isolate;
            background: linear-gradient(155deg, #E8F4FD 0%, #D7ECFA 48%, #E5F2FC 100%);
        }

        .lotus-watermark-layer {
            position: absolute;
            inset: 0;
            z-index: 1;
            pointer-events: none;
            overflow: hidden;
            opacity: 0.22;
        }

        .lotus-content-layer {
            position: relative;
            z-index: 2;
        }

        /* การ์ดแสดงผลคิวบนหน้าจอ 21 นิ้ว */
        .tv-queue-card {
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(8px);
            border: 3px solid #7DD3FC;
            box-shadow: 0 18px 42px -12px rgba(16, 42, 67, 0.16);
        }

        .tv-queue-card.active-call {
            background: rgba(255, 255, 255, 0.94);
            border-color: #0284C7;
            box-shadow: 0 22px 48px -12px rgba(2, 132, 199, 0.28);
        }

        /* เอฟเฟกต์หมายเลขคิว */
        @keyframes queuePopIn {
            0% {
                transform: scale(0.84) translateY(10px);
                opacity: 0.45;
            }
            65% {
                transform: scale(1.05) translateY(-2px);
                opacity: 1;
            }
            100% {
                transform: scale(1) translateY(0);
                opacity: 1;
            }
        }

        @keyframes queuePulseGlow {
            0%, 100% {
                text-shadow: 0 6px 20px rgba(2, 132, 199, 0.22);
                transform: translateY(0);
            }
            50% {
                text-shadow: 0 10px 30px rgba(2, 132, 199, 0.38);
                transform: translateY(-3px);
            }
        }

        .tv-queue-number {
            font-size: clamp(9.5rem, 29vh, 21rem);
            line-height: 0.96;
            animation: queuePopIn 0.55s cubic-bezier(0.22, 1, 0.36, 1), queuePulseGlow 2.8s ease-in-out infinite 0.55s;
        }

        .tv-queue-number-compact {
            font-size: clamp(7rem, 20vh, 13.5rem);
            line-height: 0.98;
            animation: queuePopIn 0.55s cubic-bezier(0.22, 1, 0.36, 1), queuePulseGlow 2.8s ease-in-out infinite 0.55s;
        }

        /* แถบตัวอักษรวิ่งด้านล่างหน้าจอแสดงผล */
        @keyframes marqueeScroll {
            0% {
                transform: translateX(0%);
            }
            100% {
                transform: translateX(-50%);
            }
        }

        .marquee-track {
            display: inline-flex;
            white-space: nowrap;
            animation: marqueeScroll 24s linear infinite;
        }

        .marquee-track:hover {
            animation-play-state: paused;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col text-slate-900 selection:bg-skybrand-200 selection:text-navy-900">
    <!-- แถบนำทางด้านบนและส่วนเนื้อหาหลัก -->
    <div id="topBarContainer"></div>
    <main id="appMain" class="flex-1 w-full"></main>

    <!-- หน้าต่างยืนยันการทำรายการ (แทนการใช้ confirm()) -->
    <div id="confirmModal" class="fixed inset-0 z-50 hidden items-center justify-center bg-slate-900/55 backdrop-blur-xs p-4">
        <div class="bg-white rounded-3xl border border-skybrand-200 shadow-2xl max-w-md w-full p-6 space-y-5">
            <div class="space-y-1.5">
                <h3 id="confirmModalTitle" class="font-display font-bold text-xl text-navy-900">ยืนยันการทำรายการ</h3>
                <p id="confirmModalMessage" class="text-sm text-slate-600 leading-relaxed"></p>
            </div>
            <div class="flex items-center justify-end gap-2.5 pt-2">
                <button
                    type="button"
                    onclick="closeConfirmModal()"
                    class="px-4 py-2.5 rounded-xl text-sm font-bold bg-slate-100 hover:bg-slate-200 text-slate-700 transition-colors"
                >
                    ยกเลิก
                </button>
                <button
                    type="button"
                    id="confirmModalAcceptBtn"
                    class="px-5 py-2.5 rounded-xl text-sm font-bold bg-skybrand-600 hover:bg-skybrand-700 text-white shadow-sm transition-colors"
                >
                    ยืนยัน
                </button>
            </div>
        </div>
    </div>

    <!-- ข้อความแจ้งเตือนมุมขวาบน -->
    <div id="toastContainer" class="fixed top-4 right-4 z-50 flex flex-col gap-2 max-w-sm pointer-events-none"></div>

    <script>
        /* =====================================================================
         * ค่าคงที่หลักและโครงสร้างระบบเรียกคิว สำนักงานสรรพากรพื้นที่สาขาบัวใหญ่
         * ===================================================================== */
        const TOTAL_TICKETS = 50;
        const STORAGE_STATE_KEY = 'buayai_rd_queue_state_v1';
        const STORAGE_LOGS_KEY = 'buayai_rd_queue_logs_v1';
        const STORAGE_SETTINGS_KEY = 'buayai_rd_queue_settings_v1';

        const DEFAULT_APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbw7ZdnNHdYTHRDXiNuH3ZJBsLRv1JvIIvZliGyOF4_ASk5Qy5VzcKv_AygJemzOesf9rw/exec';

        const COUNTERS_CONFIG = [
            { id: 1, name: 'ช่องบริการ 1', subtitle: 'บริการทั่วไป', type: 'normal', specialRoom: '' },
            { id: 2, name: 'ช่องบริการ 2', subtitle: 'บริการทั่วไป', type: 'normal', specialRoom: '' },
            { id: 3, name: 'ช่องบริการ 3', subtitle: 'บริการทั่วไป', type: 'normal', specialRoom: '' },
            { id: 4, name: 'ช่องบริการ 4', subtitle: 'บริการทั่วไป', type: 'normal', specialRoom: '' },
            { id: 5, name: 'ช่องบริการ 5', subtitle: 'บริการทั่วไป', type: 'normal', specialRoom: '' },
            { id: 6, name: 'ช่องบริการ 6', subtitle: 'บริการทั่วไป', type: 'normal', specialRoom: '' },
            { id: 7, name: 'ช่องบริการ 7', subtitle: 'บริการทั่วไป', type: 'normal', specialRoom: '' },
            { id: 8, name: 'ช่องบริการ 8', subtitle: 'บริการทั่วไป', type: 'normal', specialRoom: '' },
            { id: 9, name: 'ช่องบริการ 9', subtitle: 'ช่องทางพิเศษ • ห้องสรรพากรอำเภอ', type: 'special', specialRoom: 'ห้องสรรพากรอำเภอ' }
        ];

        const VALID_VIEWS = ['tv', 'counter', 'mobile', 'report', 'settings'];

        function getCounterConfig(counterId) {
            const num = Number(counterId);
            return COUNTERS_CONFIG.find(c => c.id === num) || COUNTERS_CONFIG[0];
        }

        function formatCounterDestination(counterId) {
            const cfg = getCounterConfig(counterId);
            if (cfg.specialRoom) {
                return `${cfg.name} (${cfg.specialRoom})`;
            }
            return cfg.name;
        }

        function getDateKey(ts = Date.now()) {
            const d = new Date(Number(ts) || Date.now());
            const y = d.getFullYear();
            const m = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${y}-${m}-${day}`;
        }

        function getMonthKey(ts = Date.now()) {
            const d = new Date(Number(ts) || Date.now());
            const y = d.getFullYear();
            const m = String(d.getMonth() + 1).padStart(2, '0');
            return `${y}-${m}`;
        }

        function formatThaiTime(ts) {
            if (!ts) return '-';
            try {
                return new Date(Number(ts)).toLocaleTimeString('th-TH', {
                    hour: '2-digit',
                    minute: '2-digit',
                    second: '2-digit'
                });
            } catch (err) {
                return '-';
            }
        }

        function formatThaiDateTime(ts) {
            if (!ts) return '-';
            try {
                return new Date(Number(ts)).toLocaleString('th-TH', {
                    year: 'numeric',
                    month: 'short',
                    day: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit'
                });
            } catch (err) {
                return '-';
            }
        }

        function escapeHTML(str) {
            return String(str ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        /* =====================================================================
         * การอ่านพารามิเตอร์ URL (?view=..., ?counter=...)
         * ===================================================================== */
        function readInitialUrlParams() {
            let view = 'tv';
            let counter = 1;
            try {
                const params = new URLSearchParams(window.location.search || '');
                const rawView = (params.get('view') || '').toLowerCase().trim();
                if (VALID_VIEWS.includes(rawView)) {
                    view = rawView;
                }
                const rawCounter = Number(params.get('counter') || '1');
                if (rawCounter >= 1 && rawCounter <= COUNTERS_CONFIG.length) {
                    counter = rawCounter;
                }
            } catch (err) {
                view = 'tv';
                counter = 1;
            }
            return { view, counter };
        }

        const initialParams = readInitialUrlParams();

        function createDefaultSettings() {
            const counterStaff = {};
            COUNTERS_CONFIG.forEach(c => {
                counterStaff[c.id] = '';
            });
            return {
                appsScriptUrl: DEFAULT_APPS_SCRIPT_URL,
                counterStaff,
                voice: {
                    enabled: true,
                    mode: 'auto', // 'auto' | 'speech' | 'online'
                    rate: 0.96,
                    pitch: 1.0,
                    volume: 1.0,
                    repeatCount: 1,
                    chimeEnabled: true
                }
            };
        }

        function createDefaultState() {
            const tickets = {};
            for (let i = 1; i <= TOTAL_TICKETS; i++) {
                tickets[i] = {
                    number: i,
                    status: 'available', // 'available' | 'waiting' | 'serving' | 'hold'
                    servedToday: false,
                    type: 'normal', // 'normal' | 'special'
                    targetCounterId: null,
                    note: '',
                    logId: null,
                    counterId: null,
                    issuedAt: null,
                    calledAt: null
                };
            }
            const counters = {};
            COUNTERS_CONFIG.forEach(c => {
                counters[c.id] = {
                    id: c.id,
                    staffName: '',
                    currentTicket: null,
                    lastCalledAt: null,
                    isBusy: false
                };
            });
            return {
                tickets,
                counters,
                waitingQueue: [],
                lastAnnouncement: null,
                lastIssuedEvent: null,
                updatedAt: 0
            };
        }

        function loadSettingsFromStorage() {
            const base = createDefaultSettings();
            try {
                const raw = localStorage.getItem(STORAGE_SETTINGS_KEY);
                if (!raw) return base;
                const parsed = JSON.parse(raw);
                return {
                    ...base,
                    ...parsed,
                    appsScriptUrl: (parsed.appsScriptUrl && String(parsed.appsScriptUrl).trim())
                        ? String(parsed.appsScriptUrl).trim()
                        : DEFAULT_APPS_SCRIPT_URL,
                    counterStaff: {
                        ...base.counterStaff,
                        ...(parsed.counterStaff || {})
                    },
                    voice: {
                        ...base.voice,
                        ...(parsed.voice || {})
                    }
                };
            } catch (err) {
                return base;
            }
        }

        function normalizeState(parsed) {
            const base = createDefaultState();
            if (!parsed || typeof parsed !== 'object') return base;

            const normalized = {
                ...base,
                waitingQueue: Array.isArray(parsed.waitingQueue)
                    ? parsed.waitingQueue.map(Number).filter(n => n >= 1 && n <= TOTAL_TICKETS)
                    : [],
                lastAnnouncement: parsed.lastAnnouncement || null,
                lastIssuedEvent: parsed.lastIssuedEvent || null,
                updatedAt: Number(parsed.updatedAt || 0)
            };

            for (let i = 1; i <= TOTAL_TICKETS; i++) {
                if (parsed.tickets && parsed.tickets[i]) {
                    normalized.tickets[i] = {
                        ...base.tickets[i],
                        ...parsed.tickets[i],
                        number: i,
                        servedToday: Boolean(parsed.tickets[i].servedToday)
                    };
                }
            }

            COUNTERS_CONFIG.forEach(c => {
                const incoming = parsed.counters && parsed.counters[c.id] ? parsed.counters[c.id] : {};
                normalized.counters[c.id] = {
                    ...base.counters[c.id],
                    ...incoming,
                    id: c.id,
                    currentTicket: incoming.currentTicket ? Number(incoming.currentTicket) : null,
                    isBusy: Boolean(incoming.isBusy)
                };
            });

            return normalized;
        }

        function loadStateFromStorage() {
            try {
                const raw = localStorage.getItem(STORAGE_STATE_KEY);
                if (!raw) return createDefaultState();
                return normalizeState(JSON.parse(raw));
            } catch (err) {
                return createDefaultState();
            }
        }

        function loadLogsFromStorage() {
            try {
                const raw = localStorage.getItem(STORAGE_LOGS_KEY);
                if (!raw) return [];
                const parsed = JSON.parse(raw);
                return Array.isArray(parsed) ? parsed : [];
            } catch (err) {
                return [];
            }
        }

        let appSettings = loadSettingsFromStorage();
        let appState = loadStateFromStorage();
        let issueLogs = loadLogsFromStorage();

        // บังคับให้หน้าจอแสดงผลคิว (?view=tv) เปิดเสียงประกาศเสมอตั้งแต่เริ่มต้น
        if (initialParams.view === 'tv') {
            appSettings.voice.enabled = true;
        }

        const uiState = {
            currentView: initialParams.view,
            activeCounterId: initialParams.counter,
            audioEnabled: initialParams.view === 'tv' ? true : Boolean(appSettings.voice.enabled),
            syncStatus: 'local', // 'local' | 'syncing' | 'connected' | 'error'
            syncMessage: 'พร้อมใช้งาน',
            lastAnnouncedKey: null,
            dismissedIssueEventKey: null,
            mobileSelectedNumber: null,
            mobileServiceType: 'normal', // 'normal' | 'special'
            mobileTargetCounter: '',
            mobileNote: '',
            reportTab: 'daily', // 'daily' | 'monthly'
            selectedReportDate: getDateKey(),
            selectedReportMonth: getMonthKey(),
            customCallNumber: '',
            transferTargetCounterId: '',
            previewTicketNumber: 1,
            previewCounterId: 1,
            previewStatusText: 'พร้อมพรีวิวเสียงประกาศภาษาไทย',
            previewLastSpokenText: ''
        };

        function persistLocalCache() {
            try {
                appState.updatedAt = Date.now();
                localStorage.setItem(STORAGE_STATE_KEY, JSON.stringify(appState));
                localStorage.setItem(STORAGE_LOGS_KEY, JSON.stringify(issueLogs));
                localStorage.setItem(STORAGE_SETTINGS_KEY, JSON.stringify(appSettings));
            } catch (err) {
                console.warn('ไม่สามารถบันทึกข้อมูลลง localStorage:', err);
            }
        }

        /* =====================================================================
         * ระบบแจ้งเตือนและหน้าต่างยืนยัน
         * ===================================================================== */
        function showToast(message, variant = 'info') {
            const container = document.getElementById('toastContainer');
            if (!container) return;

            const colorMap = {
                success: 'bg-emerald-700 text-white border-emerald-800',
                error: 'bg-rose-700 text-white border-rose-800',
                warning: 'bg-amber-600 text-white border-amber-700',
                info: 'bg-navy-800 text-white border-navy-900'
            };

            const toast = document.createElement('div');
            toast.className = `pointer-events-auto px-4 py-3 rounded-2xl border shadow-lg text-sm font-semibold transition-all duration-300 ${colorMap[variant] || colorMap.info}`;
            toast.textContent = message;
            container.appendChild(toast);

            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateY(-6px)';
                setTimeout(() => toast.remove(), 250);
            }, 3400);
        }

        let pendingConfirmCallback = null;

        function openConfirmModal(title, message, onConfirm) {
            const modal = document.getElementById('confirmModal');
            const titleEl = document.getElementById('confirmModalTitle');
            const msgEl = document.getElementById('confirmModalMessage');
            const acceptBtn = document.getElementById('confirmModalAcceptBtn');

            if (!modal || !titleEl || !msgEl || !acceptBtn) return;

            titleEl.textContent = title;
            msgEl.textContent = message;
            pendingConfirmCallback = typeof onConfirm === 'function' ? onConfirm : null;

            acceptBtn.onclick = async () => {
                const cb = pendingConfirmCallback;
                closeConfirmModal();
                if (cb) {
                    await cb();
                }
            };

            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function closeConfirmModal() {
            const modal = document.getElementById('confirmModal');
            if (!modal) return;
            modal.classList.add('hidden');
            modal.classList.remove('flex');
            pendingConfirmCallback = null;
        }

        /* =====================================================================
         * ระบบเสียงกระดิ่งและเสียงประกาศภาษาไทย 100% (Web Speech API + เสียงออนไลน์สำรอง)
         * ===================================================================== */
        let audioCtxInstance = null;
        let activeFallbackAudio = null;
        let speechPlaybackQueue = Promise.resolve();
        let availableThaiVoices = [];

        const THAI_DIGIT_WORDS = ['ศูนย์', 'หนึ่ง', 'สอง', 'สาม', 'สี่', 'ห้า', 'หก', 'เจ็ด', 'แปด', 'เก้า'];

        /**
         * แปลงตัวเลขเป็นคำอ่านภาษาไทยอย่างชัดเจน ป้องกันการอ่านข้ามหรืออ่านเป็นภาษาอื่น
         * @param {number|string} rawNum
         * @return {string}
         */
        function numberToSpokenThai(rawNum) {
            const n = Math.floor(Math.abs(Number(rawNum) || 0));
            if (n === 0) return 'ศูนย์';
            if (n < 10) return THAI_DIGIT_WORDS[n];
            if (n === 10) return 'สิบ';
            if (n < 20) {
                const unit = n % 10;
                return unit === 1 ? 'สิบเอ็ด' : `สิบ${THAI_DIGIT_WORDS[unit]}`;
            }
            if (n < 100) {
                const tens = Math.floor(n / 10);
                const unit = n % 10;
                const tensWord = tens === 2 ? 'ยี่สิบ' : `${THAI_DIGIT_WORDS[tens]}สิบ`;
                if (unit === 0) return tensWord;
                if (unit === 1) return `${tensWord}เอ็ด`;
                return `${tensWord}${THAI_DIGIT_WORDS[unit]}`;
            }
            return String(n)
                .split('')
                .map(ch => (/\d/.test(ch) ? THAI_DIGIT_WORDS[Number(ch)] : ch))
                .join(' ');
        }

        function setPreviewStatus(statusText, spokenText = null) {
            uiState.previewStatusText = statusText;
            if (spokenText !== null) {
                uiState.previewLastSpokenText = spokenText;
            }
            const statusEl = document.getElementById('voicePreviewStatusText');
            const scriptEl = document.getElementById('voicePreviewSpokenScript');
            if (statusEl) statusEl.textContent = uiState.previewStatusText;
            if (scriptEl && spokenText !== null) scriptEl.textContent = uiState.previewLastSpokenText;
        }

        function refreshThaiVoices() {
            try {
                if (!('speechSynthesis' in window)) {
                    availableThaiVoices = [];
                    return [];
                }
                const allVoices = window.speechSynthesis.getVoices() || [];
                // คัดกรองเฉพาะเสียงภาษาไทยแท้ (th-TH / th) เท่านั้น ไม่ปะปนภาษาอื่น
                availableThaiVoices = allVoices.filter(v => {
                    const lang = String(v.lang || '').trim().toLowerCase();
                    return lang === 'th-th' || lang === 'th' || lang.startsWith('th-');
                });
                return availableThaiVoices;
            } catch (err) {
                return [];
            }
        }

        if ('speechSynthesis' in window) {
            refreshThaiVoices();
            window.speechSynthesis.onvoiceschanged = () => {
                refreshThaiVoices();
            };
        }

        function ensureAudioContextUnlocked() {
            try {
                const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                if (AudioContextClass) {
                    if (!audioCtxInstance) {
                        audioCtxInstance = new AudioContextClass();
                    }
                    if (audioCtxInstance.state === 'suspended') {
                        audioCtxInstance.resume().catch(() => {});
                    }
                }
            } catch (err) {}

            try {
                if ('speechSynthesis' in window) {
                    if (window.speechSynthesis.paused) {
                        window.speechSynthesis.resume();
                    }
                    refreshThaiVoices();
                }
            } catch (err) {}
        }

        function playChimeSound() {
            if (!appSettings.voice.chimeEnabled) return Promise.resolve();
            return new Promise(resolve => {
                try {
                    ensureAudioContextUnlocked();
                    if (!audioCtxInstance) {
                        setTimeout(resolve, 180);
                        return;
                    }
                    const now = audioCtxInstance.currentTime;
                    const freqs = [880, 1174.66];
                    freqs.forEach((freq, idx) => {
                        const osc = audioCtxInstance.createOscillator();
                        const gain = audioCtxInstance.createGain();
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(freq, now + idx * 0.16);

                        const peak = Math.min(0.25, Math.max(0.04, Number(appSettings.voice.volume || 1) * 0.2));
                        gain.gain.setValueAtTime(0.0001, now + idx * 0.16);
                        gain.gain.exponentialRampToValueAtTime(peak, now + idx * 0.16 + 0.025);
                        gain.gain.exponentialRampToValueAtTime(0.0001, now + idx * 0.16 + 0.52);

                        osc.connect(gain);
                        gain.connect(audioCtxInstance.destination);

                        osc.start(now + idx * 0.16);
                        osc.stop(now + idx * 0.16 + 0.55);
                    });

                    setTimeout(resolve, 680);
                } catch (err) {
                    setTimeout(resolve, 180);
                }
            });
        }

        function buildAnnouncementText(ticketNumber, counterId) {

            const roomPhrase = cfg.specialRoom ? ` ${cfg.specialRoom}` : '';
            return `ขอเชิญหมายเลข ${spokenTicket} ติดต่อที่ช่องบริการที่ ${spokenCounter}${roomPhrase} ค่ะ`;
        }

        function speakWithBrowserTTS(text) {
            return new Promise((resolve, reject) => {
                try {
                    if (!('speechSynthesis' in window) || typeof SpeechSynthesisUtterance === 'undefined') {
                        reject(new Error('เบราว์เซอร์ไม่รองรับเสียงพูดภาษาไทยในเครื่อง'));
                        return;
                    }

                    const voices = refreshThaiVoices();
                    if (voices.length === 0) {
                        reject(new Error('ไม่พบเสียงภาษาไทยในเครื่อง'));
                        return;
                    }

                    if (window.speechSynthesis.paused) {
                        window.speechSynthesis.resume();
                    }

                    const utterance = new SpeechSynthesisUtterance(text);
                    utterance.lang = 'th-TH';
                    utterance.voice = voices[0];
                    utterance.rate = Number(appSettings.voice.rate || 0.96);
                    utterance.pitch = Number(appSettings.voice.pitch || 1.0);
                    utterance.volume = Number(appSettings.voice.volume || 1.0);

                    let started = false;
                    let settled = false;

                    const finish = (ok, err) => {
                        if (settled) return;
                        settled = true;
                        clearTimeout(startWatchdog);
                        clearTimeout(maxDurationTimer);
                        if (ok) resolve();
                        else reject(err || new Error('ออกเสียงภาษาไทยไม่สำเร็จ'));
                    };

                    utterance.onstart = () => {
                        started = true;
                        setPreviewStatus('กำลังออกเสียงภาษาไทย (เสียงในเครื่อง)', text);
                    };

                    utterance.onend = () => {
                        finish(true);
                    };

                    utterance.onerror = (ev) => {
                        finish(false, ev && ev.error ? new Error(ev.error) : new Error('เกิดข้อผิดพลาดในการออกเสียงภาษาไทย'));
                    };

                    const startWatchdog = setTimeout(() => {
                        if (!started) {
                            try {
                                window.speechSynthesis.cancel();
                            } catch (e) {}
                            finish(false, new Error('เสียงในเครื่องไม่ตอบสนองทันเวลา'));
                        }
                    }, 1600);

                    const maxDurationTimer = setTimeout(() => {
                        finish(true);
                    }, 10500);

                    window.speechSynthesis.cancel();
                    window.speechSynthesis.speak(utterance);
                } catch (err) {
                    reject(err);
                }
            });
        }

        function speakWithOnlineFallback(text) {
            return new Promise((resolve, reject) => {
                try {
                    if (activeFallbackAudio) {
                        try {
                            activeFallbackAudio.pause();
                            activeFallbackAudio.currentTime = 0;
                        } catch (e) {}
                        activeFallbackAudio = null;
                    }

                    const encoded = encodeURIComponent(text);
                    const ttsUrl = `https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=th&q=${encoded}`;
                    const audio = new Audio(ttsUrl);
                    audio.volume = Math.min(1, Math.max(0, Number(appSettings.voice.volume || 1)));
                    audio.playbackRate = Math.min(1.4, Math.max(0.65, Number(appSettings.voice.rate || 0.96)));
                    activeFallbackAudio = audio;

                    let settled = false;
                    const done = (ok, err) => {
                        if (settled) return;
                        settled = true;
                        clearTimeout(safetyTimer);
                        if (activeFallbackAudio === audio) {
                            activeFallbackAudio = null;
                        }
                        if (ok) resolve();
                        else reject(err || new Error('ไม่สามารถเล่นเสียงภาษาไทยสำรองได้'));
                    };

                    const safetyTimer = setTimeout(() => {
                        done(true);
                    }, 11000);

                    audio.onplay = () => {
                        setPreviewStatus('กำลังออกเสียงภาษาไทย (เสียงสำรองภาษาไทย)', text);
                    };
                    audio.onended = () => done(true);
                    audio.onerror = () => done(false, new Error('เล่นเสียงภาษาไทยสำรองไม่สำเร็จ'));

                    const playPromise = audio.play();
                    if (playPromise && typeof playPromise.then === 'function') {
                        playPromise.catch(err => done(false, err));
                    }
                } catch (err) {
                    reject(err);
                }
            });
        }

        function speakThaiAnnouncement(text) {
            const cleaned = String(text || '').trim();
            if (!cleaned) return Promise.resolve();

            const mode = appSettings.voice.mode || 'auto';
            const repeatCount = Math.max(1, Math.min(3, Number(appSettings.voice.repeatCount || 1)));

            speechPlaybackQueue = speechPlaybackQueue.then(async () => {
                setPreviewStatus('กำลังเตรียมออกเสียงภาษาไทย...', cleaned);
                for (let r = 0; r < repeatCount; r++) {
                    if (mode === 'speech') {
                        await speakWithBrowserTTS(cleaned);
                    } else if (mode === 'online') {
                        await speakWithOnlineFallback(cleaned);
                    } else {
                        try {
                            await speakWithBrowserTTS(cleaned);
                        } catch (ttsErr) {
                            await speakWithOnlineFallback(cleaned);
                        }
                    }
                    if (r < repeatCount - 1) {
                        await new Promise(res => setTimeout(res, 450));
                    }
                }
                setPreviewStatus('ออกเสียงภาษาไทยเสร็จสิ้นแล้ว', cleaned);
            }).catch(err => {
                console.warn('ประกาศเสียงภาษาไทย:', err);
                setPreviewStatus('ไม่สามารถออกเสียงได้ กรุณาตรวจสอบลำโพงหรือลองอีกครั้ง', cleaned);
            });

            return speechPlaybackQueue;
        }

        function applyRemoteSnapshot(data) {
            if (!data || data.ok !== true) return false;

            if (data.state && typeof data.state === 'object') {
                const incomingUpdatedAt = Number(data.state.updatedAt || 0);
                const currentUpdatedAt = Number(appState.updatedAt || 0);
                if (incomingUpdatedAt >= currentUpdatedAt || currentUpdatedAt === 0) {
                    appState = normalizeState(data.state);
                }
            }

            if (Array.isArray(data.issueLogs)) {
                const mergedMap = new Map();
                issueLogs.forEach(item => {
                    if (item && item.id) mergedMap.set(String(item.id), item);
                });
                data.issueLogs.forEach(item => {
                    if (item && item.id) {
                        const existing = mergedMap.get(String(item.id));
                        if (!existing || Number(item.issuedAt || 0) >= Number(existing.issuedAt || 0)) {
                            mergedMap.set(String(item.id), item);
                        }
                    }
                });
                issueLogs = Array.from(mergedMap.values()).sort((a, b) => Number(b.issuedAt || 0) - Number(a.issuedAt || 0));
            }

            persistLocalCache();
            checkIncomingAnnouncementAndEvents();
            return true;
        }

        async function fetchSnapshotFromSheet(silent = true) {
            const url = getActiveAppsScriptUrl();
            if (!url) {
                updateSyncBadge('local', 'โหมดออฟไลน์ในเครื่อง');
                return false;
            }

            if (!silent) {
                updateSyncBadge('syncing', 'กำลังดึงข้อมูลจาก Sheet...');
            }

            try {
                const sep = url.includes('?') ? '&' : '?';
                const resp = await fetch(`${url}${sep}action=getSnapshot&_t=${Date.now()}`, {
                    method: 'GET',
                    cache: 'no-store'
                });
                if (!resp.ok) {
                    throw new Error(`HTTP ${resp.status}`);
                }
                const json = await resp.json();
                if (json && json.ok) {
                    applyRemoteSnapshot(json);
                    updateSyncBadge('connected', 'Google Sheets • ซิงค์เรียลไทม์');
                    if (!silent) {
                        renderApp();
                    }
                    return true;
                }
                throw new Error(json && json.error ? json.error : 'ข้อมูลตอบกลับไม่ถูกต้อง');
            } catch (err) {
                console.warn('ดึงข้อมูลจาก Google Sheet ไม่สำเร็จ:', err);
                updateSyncBadge('error', 'เชื่อมต่อ Google Sheet ไม่ได้ (ใช้ข้อมูลในเครื่อง)');
                return false;
            }
        }

        async function syncStateToSheet(logEntry = null, logUpdate = null, deleteLogIds = null) {
            persistLocalCache();
            const url = getActiveAppsScriptUrl();
            if (!url) {
                updateSyncBadge('local', 'บันทึกในเครื่องแล้ว');
                return false;
            }

            updateSyncBadge('syncing', 'กำลังซิงค์กับ Google Sheet...');

            try {
                const payload = {
                    action: 'syncAll',
                    state: appState,
                    logEntry: logEntry || null,
                    logUpdate: logUpdate || null,
                    deleteLogIds: Array.isArray(deleteLogIds) && deleteLogIds.length > 0 ? deleteLogIds : null
                };

                const resp = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(payload)
                });

                if (!resp.ok) {
                    throw new Error(`HTTP ${resp.status}`);
                }

                const json = await resp.json();
                if (json && json.ok) {
                    if (Array.isArray(json.issueLogs)) {
                        issueLogs = json.issueLogs;
                        persistLocalCache();
                    }
                    updateSyncBadge('connected', 'Google Sheets • ซิงค์เรียลไทม์');
                    return true;
                }
                throw new Error(json && json.error ? json.error : 'ซิงค์ไม่สำเร็จ');
            } catch (err) {
                console.warn('ซิงค์ข้อมูลไป Google Sheet ไม่สำเร็จ:', err);
                updateSyncBadge('error', 'ซิงค์ไม่สำเร็จ (เก็บสำรองในเครื่องแล้ว)');
                return false;
            }
        }

        function pickNextWaitingTicketForCounter(counterId) {
            const cId = Number(counterId);
            const cfg = getCounterConfig(cId);

            // ค้นหาคิวรอเรียกที่ระบุช่องปลายทางตรงกับช่องนี้ก่อน
            const targetedIdx = appState.waitingQueue.findIndex(num => {
                const t = appState.tickets[num];
                return t && t.status === 'waiting' && Number(t.targetCounterId) === cId;
            });
            if (targetedIdx !== -1) {
                const [chosen] = appState.waitingQueue.splice(targetedIdx, 1);
                return chosen;
            }

            // หากเป็นช่อง 9 ให้ดูคิวประเภทพิเศษที่ไม่ได้ระบุช่องอื่นก่อน
            if (cfg.type === 'special') {
                const specialIdx = appState.waitingQueue.findIndex(num => {
                    const t = appState.tickets[num];
                    return t && t.status === 'waiting' && t.type === 'special' && !t.targetCounterId;
                });
                if (specialIdx !== -1) {
                    const [chosen] = appState.waitingQueue.splice(specialIdx, 1);
                    return chosen;
                }
            }

            // ค้นหาคิวรอเรียกทั่วไปหรือคิวที่ไม่ได้ระบุช่องอื่น
            const generalIdx = appState.waitingQueue.findIndex(num => {
                const t = appState.tickets[num];
                if (!t || t.status !== 'waiting') return false;
                if (t.targetCounterId && Number(t.targetCounterId) !== cId) return false;
                if (cfg.type !== 'special' && t.type === 'special') return false;
                return true;
            });
            if (generalIdx !== -1) {
                const [chosen] = appState.waitingQueue.splice(generalIdx, 1);
                return chosen;
            }

            // หากไม่มีคิวที่ตรงเงื่อนไขเฉพาะ ให้หยิบคิวแรกที่รอเรียกอยู่
            while (appState.waitingQueue.length > 0) {
                const candidate = appState.waitingQueue.shift();
                const t = appState.tickets[candidate];
                if (t && t.status === 'waiting') {
                    return candidate;
                }
            }
            return null;
        }

        async function callSpecificTicketOnCounter(ticketNumber, counterId) {
            const num = Number(ticketNumber);
            const cId = Number(counterId);
            if (!num || num < 1 || num > TOTAL_TICKETS) {
                showToast('กรุณาระบุหมายเลขคิว 1–50', 'warning');
                return;
            }

            const ticket = appState.tickets[num];
            if (!ticket) return;

            // หากช่องนี้มีคิวเดิมกำลังให้บริการอยู่ ให้คืนบัตรเดิมเข้าสถานะว่างพร้อมบันทึกว่าให้บริการแล้วเสร็จ
            const counterObj = appState.counters[cId];
            const logUpdates = [];
            const now = Date.now();

            if (counterObj && counterObj.currentTicket && Number(counterObj.currentTicket) !== num) {
                const prevNum = Number(counterObj.currentTicket);
                const prevTicket = appState.tickets[prevNum];
                if (prevTicket && prevTicket.status === 'serving') {
                    if (prevTicket.logId) {
                        const logIdx = issueLogs.findIndex(l => l.id === prevTicket.logId);
                        if (logIdx !== -1) {
                            issueLogs[logIdx].status = 'completed';
                            issueLogs[logIdx].completedAt = now;
                            issueLogs[logIdx].servedCounterId = cId;
                        }
                        logUpdates.push({
                            id: prevTicket.logId,
                            fields: {
                                status: 'completed',
                                completedAt: now,
                                servedCounterId: cId
                            }
                        });
                    }
                    prevTicket.status = 'available';
                    prevTicket.servedToday = true;
                    prevTicket.type = 'normal';
                    prevTicket.targetCounterId = null;
                    prevTicket.note = '';
                    prevTicket.logId = null;
                    prevTicket.counterId = null;
                    prevTicket.issuedAt = null;
                    prevTicket.calledAt = null;
                }
            }

            appState.waitingQueue = appState.waitingQueue.filter(n => n !== num);

            ticket.status = 'serving';
            ticket.servedToday = true;
            ticket.counterId = cId;
            ticket.calledAt = now;

            if (!ticket.logId) {
                const newLogId = `LOG-${now}-${num}`;
                ticket.logId = newLogId;
                const newEntry = {
                    id: newLogId,
                    ticketNumber: num,
                    type: ticket.type || 'normal',
                    targetCounterId: ticket.targetCounterId || cId,
                    servedCounterId: cId,
                    note: ticket.note || 'เรียกคิวโดยตรง',
                    issuedAt: ticket.issuedAt || now,
                    calledAt: now,
                    completedAt: null,
                    status: 'serving',
                    dateStr: getDateKey(now),
                    monthStr: getMonthKey(now)
                };
                issueLogs.unshift(newEntry);
                await syncStateToSheet(newEntry, logUpdates.length > 0 ? logUpdates : null, null);
            } else {
                const logIdx = issueLogs.findIndex(l => l.id === ticket.logId);
                if (logIdx !== -1) {
                    issueLogs[logIdx].status = 'serving';
                    issueLogs[logIdx].servedCounterId = cId;
                    issueLogs[logIdx].calledAt = now;
                }
                logUpdates.push({
                    id: ticket.logId,
                    fields: {
                        status: 'serving',
                        servedCounterId: cId,
                        calledAt: now
                    }
                });
                await syncStateToSheet(null, logUpdates, null);
            }

            appState.counters[cId] = {
                ...appState.counters[cId],
                id: cId,
                currentTicket: num,
                lastCalledAt: now,
                isBusy: false
            };

            const announcementKey = `${now}-${cId}-${num}`;
            appState.lastAnnouncement = {
                key: announcementKey,
                ticketNumber: num,
                counterId: cId,
                announcedAt: now
            };
            uiState.lastAnnouncedKey = announcementKey;

            renderApp();
            await announceCall(num, cId, { force: true });
        }

        async function callNextTicketOnCounter(counterId) {
            const nextNum = pickNextWaitingTicketForCounter(counterId);
            if (!nextNum) {
                showToast(`ไม่มีคิวรอเรียกสำหรับช่องบริการ ${counterId}`, 'info');
                return;
            }
            await callSpecificTicketOnCounter(nextNum, counterId);
        }

        async function recallTicketOnCounter(counterId) {
            const cId = Number(counterId);
            const counterObj = appState.counters[cId];
            const currentNum = counterObj && counterObj.currentTicket ? Number(counterObj.currentTicket) : null;
            if (!currentNum) {
                showToast(`ไม่มีคิวที่กำลังเรียกในช่องบริการ ${cId}`, 'warning');
                return;
            }
            const now = Date.now();
            const announcementKey = `${now}-${cId}-${currentNum}-recall`;
            appState.lastAnnouncement = {
                key: announcementKey,
                ticketNumber: currentNum,
                counterId: cId,
                announcedAt: now
            };
            uiState.lastAnnouncedKey = announcementKey;
            persistLocalCache();
            await announceCall(currentNum, cId, { force: true });
            showToast(`เรียกซ้ำหมายเลข ${currentNum} ที่ช่องบริการ ${cId}`, 'success');
        }

        async function holdTicketOnCounter(counterId) {
            const cId = Number(counterId);
            const counterObj = appState.counters[cId];
            const currentNum = counterObj && counterObj.currentTicket ? Number(counterObj.currentTicket) : null;
            if (!currentNum) {
                showToast('ไม่มีคิวที่กำลังให้บริการเพื่อพักคิว', 'warning');
                return;
            }

            const ticket = appState.tickets[currentNum];
            const logUpdates = [];
            if (ticket) {
                ticket.status = 'hold';
                ticket.counterId = null;
                if (ticket.logId) {
                    const idx = issueLogs.findIndex(l => l.id === ticket.logId);
                    if (idx !== -1) issueLogs[idx].status = 'hold';
                    logUpdates.push({ id: ticket.logId, fields: { status: 'hold' } });
                }
            }

            appState.counters[cId].currentTicket = null;
            renderApp();
            showToast(`พักคิวหมายเลข ${currentNum} ชั่วคราว`, 'info');
            await syncStateToSheet(null, logUpdates.length > 0 ? logUpdates : null, null);
        }

        /**
         * โอนคิวที่กำลังให้บริการจากช่องปัจจุบันไปยังช่องบริการอื่น (1-9)
         * หลังโอนสำเร็จ สถานะของช่องผู้โอนจะถูกล้างเป็นว่าง (ไม่มีคิวนี้ค้างอยู่ที่ผู้โอน)
         * @param {number} fromCounterId
         * @param {number|string} toCounterIdRaw
         */
        async function transferTicketToCounter(fromCounterId, toCounterIdRaw) {
            const sourceId = Number(fromCounterId);
            const targetId = Number(toCounterIdRaw);
            const sourceCounter = appState.counters[sourceId];
            const currentNum = sourceCounter && sourceCounter.currentTicket ? Number(sourceCounter.currentTicket) : null;

            if (!currentNum) {
                showToast(`ไม่มีคิวที่กำลังให้บริการในช่องบริการ ${sourceId} สำหรับโอน`, 'warning');
                return;
            }

            if (!targetId || targetId < 1 || targetId > COUNTERS_CONFIG.length) {
                showToast('กรุณาเลือกช่องบริการปลายทางที่ต้องการโอนคิวไป', 'warning');
                return;
            }

            if (targetId === sourceId) {
                showToast('ไม่สามารถโอนคิวไปยังช่องบริการเดิมได้ กรุณาเลือกช่องอื่น', 'warning');
                return;
            }

            const ticket = appState.tickets[currentNum];
            if (!ticket) {
                showToast('ไม่พบข้อมูลบัตรคิวที่ต้องการโอน', 'error');
                return;
            }

            const now = Date.now();
            const targetCfg = getCounterConfig(targetId);
            const sourceCfg = getCounterConfig(sourceId);
            const transferNote = `โอนจาก${sourceCfg.name} ไป${targetCfg.name}`;

            // ล้างสถานะคิวออกจากช่องผู้โอนทันที (ผู้โอนไม่มีคิวนี้ค้างอยู่)
            appState.counters[sourceId] = {
                ...appState.counters[sourceId],
                id: sourceId,
                currentTicket: null,
                isBusy: false
            };

            // เปลี่ยนสถานะบัตรกลับเป็นรอเรียก (waiting) และระบุช่องบริการปลายทางใหม่
            ticket.status = 'waiting';
            ticket.counterId = null;
            ticket.calledAt = null;
            ticket.targetCounterId = targetId;
            ticket.type = targetCfg.type === 'special' ? 'special' : 'normal';
            ticket.note = ticket.note ? `${ticket.note} • ${transferNote}` : transferNote;

            // จัดคิวที่โอนให้อยู่ลำดับต้นของคิวรอเรียกเพื่อรับบริการต่อเนื่องที่ช่องปลายทาง
            appState.waitingQueue = appState.waitingQueue.filter(n => n !== currentNum);
            appState.waitingQueue.unshift(currentNum);

            const logUpdates = [];
            if (ticket.logId) {
                const idx = issueLogs.findIndex(l => l.id === ticket.logId);
                if (idx !== -1) {
                    issueLogs[idx].status = 'waiting';
                    issueLogs[idx].targetCounterId = targetId;
                    issueLogs[idx].note = ticket.note;
                }
                logUpdates.push({
                    id: ticket.logId,
                    fields: {
                        status: 'waiting',
                        targetCounterId: targetId,
                        note: ticket.note
                    }
                });
            }

            uiState.transferTargetCounterId = '';
            renderApp();
            showToast(
                `โอนคิวหมายเลข ${currentNum} จากช่อง ${sourceId} ไปยัง ${formatCounterDestination(targetId)} แล้ว (ช่อง ${sourceId} ไม่มีคิวค้าง)`,
                'success'
            );
            await syncStateToSheet(null, logUpdates.length > 0 ? logUpdates : null, null);
        }

        async function completeTicketOnCounter(counterId) {
            const cId = Number(counterId);
            const counterObj = appState.counters[cId];
            const currentNum = counterObj && counterObj.currentTicket ? Number(counterObj.currentTicket) : null;
            if (!currentNum) {
                showToast('ไม่มีคิวที่กำลังให้บริการในช่องนี้', 'warning');

            openConfirmModal(

                                class="px-6 py-3 rounded-2xl font-display font-extrabold text-sm sm:text-base bg-navy-800 hover:bg-navy-900 text-white shadow-sm transition-all"
                            >
                                ✓ บันทึกการตั้งค่าทั้งหมด
                            </button>
                        </div>
                    </div>
                </section>
            `;
        }

        /* =====================================================================
         * การเรนเดอร์หลักและรอบการซิงค์ข้อมูลอัตโนมัติ
         * ===================================================================== */
        function renderApp() {
            try {
                renderTopBar();
                const mainEl = document.getElementById('appMain');
                if (!mainEl) return;

                if (uiState.currentView === 'tv') {
                    mainEl.innerHTML = renderTvDisplayHTML();
                } else if (uiState.currentView === 'counter') {
                    mainEl.innerHTML = renderCounterConsoleHTML();
                } else if (uiState.currentView === 'mobile') {
                    mainEl.innerHTML = renderMobileIssuerHTML();
                } else if (uiState.currentView === 'report') {
                    mainEl.innerHTML = renderReportHTML();
                } else if (uiState.currentView === 'settings') {
                    mainEl.innerHTML = renderSettingsHTML();
                } else {
                    mainEl.innerHTML = renderTvDisplayHTML();
                }

                updateSyncBadge(uiState.syncStatus, uiState.syncMessage);
            } catch (err) {
                console.error('เกิดข้อผิดพลาดในการแสดงผลหน้าเว็บ:', err);
                const mainEl = document.getElementById('appMain');
                if (mainEl) {
                    mainEl.innerHTML = `
                        <div class="max-w-xl mx-auto my-12 p-6 rounded-3xl bg-white border border-rose-200 text-center space-y-3">
                            <h2 class="font-display font-extrabold text-lg text-rose-700">พบปัญหาในการแสดงผลบางส่วน</h2>
                            <p class="text-sm text-slate-600">${escapeHTML(err && err.message ? err.message : 'กรุณาลองรีเฟรชหน้าเว็บอีกครั้ง')}</p>
                            <button type="button" onclick="window.location.reload()" class="px-4 py-2 rounded-xl text-xs font-bold bg-navy-800 text-white">รีเฟรชหน้าเว็บ</button>
                        </div>
                    `;
                }
            }
        }

        // ซิงค์ข้อมูลเริ่มต้นและตั้งรอบดึงข้อมูลอัตโนมัติทุก 3.5 วินาที
        renderApp();
        fetchSnapshotFromSheet(true).then(ok => {
            if (ok) renderApp();
        });

        setInterval(() => {
            fetchSnapshotFromSheet(true).then(ok => {
                if (ok) renderApp();
            });
        }, 3500);
    </script>
</body>
</html>
